<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <meta name="description" content="玉衡杯数据库 - 崩坏星穹铁道物品" />
        <title>物品 - 玉衡杯数据库</title>
        <link rel="stylesheet" href="../../stylesheets/thin.css" />
        <link rel="stylesheet" href="../../stylesheets/style.css" />
        <link rel="stylesheet" href="../../stylesheets/item.css" />
        <script type="module" src="../../scripts/item.js"></script>
    </head>
    <body class="bg">
        <container>
            <h3>
                <span class="title">
                    <a href="../../index.html">
                        <img src="../../images/others/logo.png" class="logo_img_yhb" alt="玉衡杯" />
                    </a>
                    <color style="font-size: 26px">
                        <br />
                        <img src="../../images/emote/Yunli/1.png" class="game_img" alt="" />
                        <b>4.5v2</b>
                    </color>
                </span>
                <em class="subtitle">
                    <p><b>yuhengcup.wiki | <span style="white-space: pre"><a href="https://space.bilibili.com/3546567522912510" target="_blank">b站@妮可少女</a></span></b></p>
                </em>
                <em class="links">
                    <img src="../../images/others/menu.png" class="_menu_" alt="菜单" />
                </em>
            </h3>

            <div class="content item-content">
                <section class="item-filter-panel">
                    <h1>物品</h1>
                    <div class="filter-group search-group">
                        <p>搜索</p>
                        <input id="itemSearch" type="text" placeholder="搜索名称或 ID" autocomplete="off" />
                    </div>
                    <div class="filter-group">
                        <p>用途</p>
                        <div id="purposeFilters" class="filter-buttons"></div>
                    </div>
                    <div class="filter-group">
                        <p>评级</p>
                        <div id="rarityFilters" class="filter-buttons"></div>
                    </div>
                </section>

                <div class="item-result-line">
                    <span id="itemCount"></span>
                </div>
                <section id="itemGrid" class="item-grid"></section>
            </div>
        </container>
    </body>
</html>

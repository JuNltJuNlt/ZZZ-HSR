<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <meta name="description" content="玉衡杯数据库 - 绝区零危局强袭战" />
        <title>危局强袭战 - 玉衡杯数据库</title>
        <link rel="stylesheet" href="../../stylesheets/thin.css" />
        <link rel="stylesheet" href="../../stylesheets/style.css" />
        <link rel="stylesheet" href="../../stylesheets/shadow.css" />
        <link rel="stylesheet" href="../../stylesheets/arbitration.css" />
        <script src="../../plugins/echarts.min.js"></script>
        <script type="module" src="../../scripts/zzz/deadly.js"></script>
        <style>
            /* 绝境关卡样式 */
            .final-section {
                margin-top: 30px;
                border-top: 2px solid #d8dee8;
                padding-top: 20px;
            }
            .final-section .section-title {
                text-align: center;
                font-size: 1.4em;
                font-weight: bold;
                color: #cc0000;
                margin: 10px 0 20px;
            }
            .final-card {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                background: #f7f9fc;
                border-radius: 8px;
                border: 2px solid #cc0000;
                padding: 20px;
                margin: 0 20px;
            }
            .final-card .monster-info {
                flex: 0 0 220px;
                text-align: center;
            }
            .final-card .monster-info .monster-name {
                font-size: 1.1em;
                font-weight: bold;
                margin-top: 8px;
            }
            .final-card .monster-info .monster-stats {
                font-size: 0.9em;
                color: #333;
                line-height: 1.6;
            }
            .final-card .monster-info .monster-stats .hp { color: #cc0000; font-weight: bold; }
            .final-card .monster-info .monster-stats .def { color: #2545ba; font-weight: bold; }
            .final-card .monster-info .monster-stats .stun { color: #000000; font-weight: bold; }
            .final-card .mechanic-box {
                flex: 1;
                min-width: 300px;
                background: #ffffff;
                border-radius: 6px;
                border: 1px solid #d8dee8;
                padding: 16px;
                max-height: 400px;
                overflow-y: auto;
            }
            .final-card .mechanic-box .mechanic-title {
                font-weight: bold;
                font-size: 1em;
                margin-bottom: 8px;
                color: #2545ba;
            }
            .final-card .mechanic-box .mechanic-item {
                font-size: 0.9em;
                line-height: 1.6;
                padding: 4px 0;
                border-bottom: 1px solid #f0f2f5;
            }
            .final-card .mechanic-box .mechanic-item:last-child {
                border-bottom: none;
            }
            .final-card .weakness-bars {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin: 8px 0;
            }
            .final-card .weakness-bars .bar-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
            }
            .final-card .weakness-bars .bar-item img {
                width: 24px;
                height: 24px;
            }
            .final-card .weakness-bars .bar-item .line {
                width: 18px;
                height: 3px;
                border-radius: 2px;
            }
            .final-card .weakness-bars .bar-item .line.weak { background-color: #4CAF50; }
            .final-card .weakness-bars .bar-item .line.resist { background-color: #C62828; }
            
            .final-chart-container {
                margin: 20px 20px 0;
                height: 300px;
            }
            
            @media (max-width: 768px) {
                .final-card .monster-info {
                    flex: 0 0 100%;
                }
                .final-card .mechanic-box {
                    max-height: 300px;
                }
            }
        </style>
    </head>
    <body class="bg">
        <container>
            <h3>
                <span class="title">
                    <a href="../../index.html">
                        <img src="../../images/others/logo.png" class="logo_img_yhb" alt="玉衡杯" />
                    </a>
                    <color style="font-size: 26px">
                        <br />
                        <img src="../../images/ZZZ%20images/emote/3.png" class="game_img" alt="" />
                        <b>3.1V12</b>
                    </color>
                </span>
                <em class="subtitle">
                    <p><b>yuhengcup.wiki | <span style="white-space: pre"><a href="https://space.bilibili.com/3546567522912510" target="_blank">b站@妮可少女</a></span></b></p>
                </em>
                <em class="links">
                    <img src="../../images/others/menu.png" class="_menu_" alt="菜单" />
                </em>
            </h3>

            <div class="content">
                <p class="content_title">危局强袭战</p>

                <div class="ver">
                    <div id="prevSchedule" class="v_l">◁</div>
                    <div class="ver_text hover-shadow">
                        <p id="scheduleName" class="ver_text_name"></p>
                        <p id="scheduleTime" class="ver_text_time"></p>
                        <select id="scheduleSelect" class="schedule_select"></select>
                    </div>
                    <div id="nextSchedule" class="v_r"><p>▷</p></div>
                </div>

                <div class="button_w">
                    <a id="downloadBtn" class="level_ dl_button hover-shadow" href="#"><span>下载图片</span></a>
                </div>

                <!-- 试炼三Boss -->
                <div id="deadlyLayout"></div>

                <!-- 绝境关卡 -->
                <div id="finalSection" class="final-section" style="display:none;">
                    <div class="section-title">— 绝境 —</div>
                    <div id="finalLayout"></div>
                    <div id="finalChartContainer" class="final-chart-container" style="display:none;">
                        <div id="finalChart" class="chart" style="width:100%;height:100%;"></div>
                    </div>
                </div>

                <!-- 试炼血量演化图 -->
                <div class="chart_container">
                    <div id="chart"></div>
                </div>
            </div>
        </container>
    </body>
</html>

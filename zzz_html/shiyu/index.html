<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <meta name="description" content="玉衡杯数据库 - 绝区零式舆防卫战" />
        <title>式舆防卫战 - 玉衡杯数据库</title>
        <link rel="stylesheet" href="../../stylesheets/thin.css" />
        <link rel="stylesheet" href="../../stylesheets/style.css" />
        <link rel="stylesheet" href="../../stylesheets/shadow.css" />
        <link rel="stylesheet" href="../../stylesheets/arbitration.css" />
        <script src="../../plugins/echarts.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
        <script type="module" src="../../scripts/zzz/shiyu.js?v=9"></script>
    </head>
    <body class="bg">
        <container>
            <h3>
                <span class="title">
                    <a href="../../index.html">
                        <img src="../../images/others/logo.png" class="logo_img_yhb" alt="玉衡杯" />
                    </a>
                    <color style="font-size: 26px">
                        <br />
                        <img src="../../images/ZZZ%20images/emote/3.png" class="game_img" alt="" />
                        <b>3.1V12</b>
                    </color>
                </span>
                <em class="subtitle">
                    <p><b>yuhengcup.wiki | <span style="white-space: pre"><a href="https://space.bilibili.com/3546567522912510" target="_blank">b站@妮可少女</a></span></b></p>
                </em>
                <em class="links">
                    <img src="../../images/others/menu.png" class="_menu_" alt="菜单" />
                </em>
            </h3>

            <div class="content">
                <p class="content_title">式舆防卫战</p>

                <div class="ver">
                    <div id="prevSchedule" class="v_l">◁</div>
                    <div class="ver_text hover-shadow">
                        <p id="scheduleName" class="ver_text_name"></p>
                        <p id="scheduleTime" class="ver_text_time"></p>
                        <select id="scheduleSelect" class="schedule_select"></select>
                    </div>
                    <div id="nextSchedule" class="v_r"><p>▷</p></div>
                </div>

                <div class="ver">
                    <div id="prevFloor" class="v_l">◀</div>
                    <div class="ver_text hover-shadow">
                        <p class="ver_text_name">节点</p>
                        <p id="floorText" class="ver_text_time"></p>
                    </div>
                    <div id="nextFloor" class="v_r"><p>▶</p></div>
                </div>

                <div class="button_w">
                    <a id="downloadBtn" class="level_ dl_button hover-shadow" href="#"><span>下载图片</span></a>
                </div>

                <div id="shiyuStages"></div>
                <div id="shiyuBuffs"></div>

                <div class="chart_container">
                    <div id="totalChart" style="width: 100%; height: 600px;"></div>
                </div>
                <div class="chart_container" style="margin-top: 30px;">
                    <div id="stageChart" style="width: 100%; height: 600px;"></div>
                </div>

                <div class="button_w">
                    <a id="togglePeakChart" class="level_ dl_button hover-shadow" href="#"><span>显示最高层演化</span></a>
                </div>

                <div id="peakChartContainer" style="display:none;">
                    <div class="chart_container" style="margin-top: 30px;">
                        <div id="peakChart" style="width: 100%; height: 600px;"></div>
                    </div>
                    <div class="chart_container" style="margin-top: 30px;">
                        <div id="peakAvgChart" style="width: 100%; height: 600px;"></div>
                    </div>
                </div>
            </div>
        </container>
    </body>
</html>
